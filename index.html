<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#03040a">
<title>NILA · Secure Access</title>
<style>
:root{--cyan:#2ef2ff;--mag:#ff2bd6;--lime:#b6ff3b;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(circle at 50% 38%,#0b1530 0%,#03040a 70%);color:#d9f7ff;
  font-family:ui-monospace,Menlo,monospace;overflow:hidden}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(var(--sat) + 24px) 24px calc(var(--sab) + 24px);text-align:center}
.ring{width:96px;height:96px;border-radius:50%;border:2px solid var(--cyan);border-right-color:transparent;border-bottom-color:transparent;
  box-shadow:0 0 22px rgba(46,242,255,.35);animation:s 6s linear infinite;position:relative;margin-bottom:26px}
.ring::after{content:'';position:absolute;inset:30px;border-radius:50%;background:var(--cyan);box-shadow:0 0 26px var(--cyan)}
@keyframes s{to{transform:rotate(360deg)}}
h1{font-size:18px;letter-spacing:.32em;color:var(--cyan);text-shadow:0 0 12px rgba(46,242,255,.6)}
p{font-size:10px;letter-spacing:.24em;color:rgba(217,247,255,.55);margin-top:8px}
form{margin-top:26px;width:min(86vw,340px);display:grid;gap:12px}
input{width:100%;font:600 16px ui-monospace,Menlo,monospace;letter-spacing:.12em;text-align:center;color:#fff;background:rgba(8,14,28,.8);
  border:1px solid rgba(46,242,255,.35);border-radius:6px;padding:14px 12px;outline:none;text-transform:uppercase}
input:focus{border-color:var(--cyan);box-shadow:0 0 14px rgba(46,242,255,.35)}
.u{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
label{display:flex;gap:8px;align-items:center;justify-content:center;font-size:10px;letter-spacing:.12em;color:rgba(217,247,255,.7)}
label input{width:auto;padding:0}
button{font:700 12px ui-monospace,Menlo,monospace;letter-spacing:.24em;color:#03040a;background:var(--cyan);border:0;border-radius:6px;padding:15px;box-shadow:0 0 22px rgba(46,242,255,.5)}
button:disabled{opacity:.5}
#msg{min-height:18px;font-size:11px;letter-spacing:.06em;color:var(--mag)}
#msg.ok{color:var(--lime)}
</style>
</head>
<body>
<main>
  <div class="ring"></div>
  <h1>NILA</h1>
  <p>FOVEATED MEDIA CODEC · AES-256</p>
  <p style="margin-top:4px;color:#b6ff3b;opacity:.8">v1.2 · IT-8.0</p>
  <form id="f" autocomplete="on">
    <input class="u" type="text" name="username" autocomplete="username" value="empath-core" tabindex="-1" aria-hidden="true">
    <input id="pw" type="password" name="password" autocomplete="current-password" placeholder="CHEIE DE ACCES" autocapitalize="characters" spellcheck="false" required>
    <label><input id="rem" type="checkbox" checked> ține minte pe acest dispozitiv</label>
    <button id="go" type="submit">▸ DECRIPTEAZĂ</button>
    <div id="msg"></div>
  </form>
</main>
